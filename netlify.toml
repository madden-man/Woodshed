[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The ask function imports the wiki from src/, so it needs a real bundler.
[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# BrowserRouter: every unmatched path serves the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
